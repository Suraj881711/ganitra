name: Unpack project zip


on:
  workflow_dispatch:
  push:
    paths:
      - ganitra-latest.zip
      - maths-gpt-wave3.zip


permissions:
  contents: write


jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and stage project
        run: |
          set -e
          ZIP_FILE=""
          if [ -f ganitra-latest.zip ]; then ZIP_FILE=ganitra-latest.zip; elif [ -f maths-gpt-wave3.zip ]; then ZIP_FILE=maths-gpt-wave3.zip; fi
          if [ -z "$ZIP_FILE" ]; then echo "No project zip found"; ls -la; exit 1; fi
          echo "Zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d _unpacked
          SRC=$(find _unpacked -type f -name app.py -print -quit | xargs -r dirname)
          if [ -z "$SRC" ]; then SRC=_unpacked; fi
          echo "Source dir: $SRC"
          ls -la "$SRC"
          cp -a "$SRC"/. .
          rm -rf _unpacked ganitra-latest.zip maths-gpt-wave3.zip
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          rm -rf .venv venv
          git status --short
      - name: Commit unpacked project
        run: |
          git config user.name "Suraj881711"
          git config user.email "Suraj881711@users.noreply.github.com"
          git add -A
          git commit -m "Update project to wave 7 (Ganitra) - Chat-only homepage, /topics page, Board chapter-test label fix" || echo "nothing to commit"
          git push
