<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ganitra — {{ t.tagline }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap"
          rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      .lang-switch { display: inline-flex; align-items: center; gap: .4rem;
                     font-size: .9rem; }
      .lang-switch select { font: inherit; padding: .25rem .4rem;
                            border-radius: .5rem; }
    </style>
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
            async></script>
  </head>
  <body>
    <header>
      <h1><a href="/">Ganitra</a></h1>
      <nav>
        <a href="/">{{ t.nav_solve }}</a>
        <a href="/practice">{{ t.nav_practice }}</a>
        <a href="/history">{{ t.nav_history }}</a>
        <label class="lang-switch">{{ t.lang_label }}
          <select id="lang-select" aria-label="{{ t.lang_label }}"
                  onchange="if (this.value) window.location.href = '/set-lang/' + this.value + '?next=' + encodeURIComponent(window.location.pathname + window.location.search);">
            {% for code, name in lang_options %}
              <option value="{{ code }}" {% if code == lang %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </label>
      </nav>
    </header>
    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">
            {% for m in messages %}<p>{{ m }}</p>{% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer>
      <p>{{ t.footer_powered }}</p>
    </footer>
  </body>
</html>
