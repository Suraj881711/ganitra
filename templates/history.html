{% extends "base.html" %}
{% block content %}
  <div class="card">
    <h2>{{ t.history_heading }}</h2>
    {% if entries %}
      <p class="muted">{{ t.history_intro }}</p>
      {% for e in entries %}
        <div class="practice-q">
          <form method="post" action="/solve" class="history-form">
            <input type="hidden" name="question" value="{{ e.question }}" />
            <button type="submit" class="linklike">{{ e.question }}</button>
          </form>
          <p class="muted">→ {{ e.result.answer }}</p>
        </div>
      {% endfor %}
      <form method="post" action="/history/clear">
        <button type="submit">{{ t.clear_history }}</button>
      </form>
    {% else %}
      <p class="muted">{{ t.history_empty }}</p>
    {% endif %}
    <a class="back" href="/">{{ t.back_to_solver }}</a>
  </div>
{% endblock %}
